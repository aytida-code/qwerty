server:
  port: 24348

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

springdoc:
  swagger-ui:
    path: /docs
    urls:
        - name: task-service
          url: /task-service/api-docs
        - name: user-service
          url: /user-service/api-docs
        - name: project-service
          url: /project-service/api-docs
